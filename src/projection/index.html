<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>圣言投屏 · 投影窗</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: #101418;
        color: #E8C87A;
        font-family: "Noto Serif CJK SC", "Source Han Serif SC", serif;
        transition: background 0.2s ease, color 0.2s ease;
        overflow: hidden;
      }
      /* R4：投影=纵向瀑布流连续滚动容器（整段所选经文一个长流，从上往下读） */
      #stage {
        height: 100vh;
        overflow-y: auto;
        overflow-x: hidden;
      }
      #stage::-webkit-scrollbar { width: 0; height: 0; }
      .passage { padding: 8%; line-height: 1.7; max-width: 100%; }
      /* R2：自然段落连续流——节号上标嵌句首，不再一节一行 */
      .flow { margin: 0; }
      .flow sup.vnum { font-size: 0.5em; margin: 0 0.3em 0 0.15em; vertical-align: super; }
      .flow .vtext { white-space: pre-wrap; }
      /* R2：当前节 = 段内句子级点亮（底色+字色，会众跟读定位） */
      .flow .vtext.current { border-radius: 6px; padding: 0 0.08em; }
      .passage-title { opacity: 0.6; margin-bottom: 1.2em; letter-spacing: 0.2em; }
      .placeholder { font-size: 36px; opacity: 0.5; padding: 8%; }
      #hint {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 20px;
        padding: 10px 0;
        background: rgba(0, 0, 0, 0.55);
        display: none;
        z-index: 20;
      }
      /* R4：底部细滚动进度条——无箭头无页数；淡显 30%，静止 3s 全隐 */
      #scrollbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 3px;
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 15;
      }
      #scrollbar.visible { opacity: 0.3; }
      #scrollbar .scrollbar-thumb {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 30%;
        left: calc(var(--scroll-ratio, 0) * 70%);
        background: #E8C87A;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div id="hint">电视请用 Win+P 扩展模式</div>
    <div id="stage"><div class="placeholder">圣言投屏</div></div>
    <div id="scrollbar"><div class="scrollbar-thumb"></div></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
