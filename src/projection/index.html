<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>圣言投屏 · 投影窗</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: #101418;
        color: #E8C87A;
        font-family: "Noto Serif CJK SC", "Source Han Serif SC", serif;
        transition: background 0.2s ease, color 0.2s ease;
        overflow: hidden;
      }
      #stage {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .passage {
        text-align: center;
        padding: 8%;
        line-height: 1.7;
        max-width: 100%;
      }
      .passage-title {
        font-size: 0.28em;
        opacity: 0.6;
        margin-bottom: 1.2em;
        letter-spacing: 0.2em;
      }
      .verse { margin: 0 0 0.4em; }
      .verse.current .vtext { text-shadow: 0 0 24px rgba(232, 200, 122, 0.25); }
      .verse sup.vnum { font-size: 0.38em; margin-right: 0.6em; vertical-align: super; }
      .placeholder { font-size: 36px; opacity: 0.5; }
      #meta {
        position: fixed;
        bottom: 3%;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 18px;
        opacity: 0.55;
      }
      .blank-overlay {
        position: fixed;
        inset: 0;
        background: #000;
        display: none;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="stage"><div class="placeholder">圣言投屏</div></div>
    <div id="meta">—</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
