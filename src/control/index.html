<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>圣言投屏 · 控制窗</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        font-family: "Noto Serif CJK SC", "Source Han Serif SC", serif;
        background: #F7F4EE;
        color: #26221C;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 18px;
        border-bottom: 1px solid #D8D2C4;
      }
      h1 { font-size: 16px; margin: 0; font-weight: 600; }
      #banner {
        font-size: 13px;
        color: #8A4A1C;
        background: #F3E2C8;
        border: 1px solid #D8B88A;
        border-radius: 6px;
        padding: 4px 10px;
        display: none;
      }
      #banner.visible { display: inline-block; }
      #layout { display: grid; grid-template-columns: 320px 230px 1fr; gap: 14px; padding: 14px 18px; }
      #books-panel, #chapters-panel, #verses-panel {
        border: 1px solid #E2DCCF;
        border-radius: 6px;
        padding: 12px 14px;
        background: #FFFFFF;
        max-height: 78vh;
        overflow-y: auto;
      }
      .search-box { position: relative; }
      .search-input {
        width: 100%;
        font-size: 14px;
        font-family: inherit;
        padding: 9px 12px;
        min-height: 40px;
        border: 1px solid #C9C0AD;
        border-radius: 6px;
        background: #FFFDF8;
        color: #26221C;
      }
      .search-input:focus { outline: 2px solid #A8863C; outline-offset: -1px; }
      .search-dropdown {
        position: absolute;
        top: 44px;
        left: 0;
        right: 0;
        z-index: 5;
        list-style: none;
        margin: 0;
        padding: 4px;
        background: #FFFDF8;
        border: 1px solid #C9C0AD;
        border-radius: 6px;
        box-shadow: 0 4px 10px rgba(38, 34, 28, 0.12);
        max-height: 300px;
        overflow-y: auto;
      }
      .search-item {
        display: flex;
        width: 100%;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        padding: 8px 10px;
        min-height: 36px;
        border: none;
        border-radius: 6px;
        background: transparent;
        cursor: pointer;
        font-family: inherit;
        text-align: left;
      }
      .search-item:hover { background: #F3EDDF; }
      .search-item-meta { font-size: 11px; color: #8C8375; font-family: ui-monospace, monospace; }
      .history-title { font-size: 13px; margin: 0 0 10px; color: #A8863C; font-weight: 600; }
      .history-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
      .history-item {
        display: flex;
        width: 100%;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        padding: 8px 10px;
        min-height: 36px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: #FFFDF8;
        cursor: pointer;
        font-family: inherit;
        text-align: left;
      }
      .history-item:hover { background: #F3EDDF; }
      .history-item-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .history-item-time { font-size: 11px; color: #8C8375; font-family: ui-monospace, monospace; flex-shrink: 0; }
      .history-empty { font-size: 13px; color: #8C8375; padding: 8px 2px; }
      .tab-bar { display: flex; gap: 8px; margin: 12px 0 10px; }
      .tab-btn {
        font-size: 14px;
        padding: 6px 14px;
        min-height: 36px;
        border: 1px solid #C9C0AD;
        border-radius: 6px;
        background: #FFFDF8;
        cursor: pointer;
      }
      .tab-btn.active { background: #F3EDDF; border-color: #A8863C; color: #A8863C; font-weight: 600; }
      .book-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
      .book-btn {
        font-size: 15px;
        padding: 10px 4px;
        min-height: 40px;
        border: 1px solid #C9C0AD;
        border-radius: 6px;
        background: #FFFDF8;
        color: #26221C;
        cursor: pointer;
        font-family: inherit;
      }
      .book-btn:hover { filter: brightness(0.96); }
      .chapter-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; }
      .chapter-btn {
        font-size: 14px;
        padding: 8px 0;
        min-height: 36px;
        border: 1px solid #C9C0AD;
        border-radius: 6px;
        background: #FFFDF8;
        cursor: pointer;
        font-family: inherit;
      }
      .chapter-btn:hover { background: #F3EDDF; }
      .chapters-title, .verses-title { font-size: 13px; margin: 0 0 10px; color: #A8863C; font-weight: 600; }
      .verse-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
      .verse-btn {
        display: block;
        width: 100%;
        text-align: left;
        font-size: 13px;
        line-height: 1.5;
        padding: 6px 10px;
        min-height: 32px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: #FFFDF8;
        cursor: pointer;
        font-family: inherit;
      }
      .verse-btn:hover { background: #F3EDDF; }
      .verse-btn.in-range { background: #F3E2C8; border-color: #D8B88A; }
      .verse-btn .vnum { font-size: 10px; margin-right: 6px; color: #A8863C; }
      section.controls-box {
        margin: 14px 18px;
        border: 1px solid #E2DCCF;
        border-radius: 6px;
        padding: 12px 14px;
        background: #FFFFFF;
      }
      .controls { display: flex; flex-wrap: wrap; gap: 8px; }
      .project-btn { min-width: 112px; font-weight: 600; }
      .project-btn.active {
        background: #A8863C;
        border-color: #8A6D2F;
        color: #FFFDF8;
      }
      button {
        font-family: inherit;
        font-size: 14px;
        padding: 10px 16px;
        min-width: 64px;
        min-height: 40px;
        border: 1px solid #C9C0AD;
        border-radius: 6px;
        background: #FFFDF8;
        color: #26221C;
        cursor: pointer;
      }
      button:hover { background: #F3EDDF; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 10px; font-size: 14px; }
      dt { color: #8C8375; }
      dd { margin: 0; font-family: ui-monospace, monospace; }
      /* T4-style 样式抽屉（§6.2 右抽屉） */
      .style-drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 300px;
        overflow-y: auto;
        padding: 14px 16px;
        background: #FFFDF8;
        border-left: 1px solid #C9C0AD;
        box-shadow: -4px 0 12px rgba(38, 34, 28, 0.1);
        z-index: 20;
      }
      .style-drawer h3 { font-size: 13px; color: #A8863C; margin: 14px 0 8px; }
      .style-drawer h3:first-child { margin-top: 0; }
      .style-section { border-bottom: 1px dashed #E2DCCF; padding-bottom: 10px; }
      .style-field { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
      .style-label { font-size: 13px; color: #26221C; flex-shrink: 0; }
      .style-field input[type="number"], .style-field select {
        width: 130px;
        font-size: 13px;
        font-family: inherit;
        padding: 6px 8px;
        min-height: 32px;
        border: 1px solid #C9C0AD;
        border-radius: 6px;
        background: #FFFFFF;
      }
      .style-field input[type="color"] { width: 48px; height: 32px; padding: 2px; border: 1px solid #C9C0AD; border-radius: 6px; background: #FFFFFF; }
      .style-theme-row { display: flex; gap: 8px; }
      .style-theme-row button { flex: 1; min-height: 40px; }
      .style-custom-input {
        width: 100%;
        font-size: 13px;
        font-family: inherit;
        padding: 8px 10px;
        min-height: 36px;
        margin-top: 6px;
        border: 1px solid #C9C0AD;
        border-radius: 6px;
        background: #FFFFFF;
      }
      .style-error { font-size: 12px; color: #A83232; margin-top: 6px; }
    </style>
  </head>
  <body>
    <header>
      <h1>圣言投屏 · 控制窗</h1>
      <span id="banner"></span>
    </header>
    <div id="layout">
      <div id="books-panel">
        <div id="search-panel"></div>
        <div id="history-panel"></div>
      </div>
      <div id="chapters-panel" hidden></div>
      <div id="verses-panel" hidden></div>
    </div>
    <section class="controls-box">
      <dl>
        <dt>selection</dt><dd id="st-selection">—</dd>
        <dt>projecting</dt><dd id="st-projecting">—</dd>
        <dt>style</dt><dd id="st-style">—</dd>
        <dt>blank</dt><dd id="st-blank">—</dd>
        <dt>lock</dt><dd id="st-lock">—</dd>
        <dt>display</dt><dd id="st-display">—</dd>
      </dl>
      <div class="controls">
        <button id="btn-project" class="project-btn" title="投屏 / 取消投屏（P）">投屏</button>
        <button id="btn-blank">黑场</button>
        <button id="btn-lock">锁屏</button>
        <button id="btn-font-up">字号 +</button>
        <button id="btn-font-down">字号 −</button>
        <button id="btn-theme">主题切换</button>
        <button id="btn-style" title="样式抽屉（S）">⚙ 样式</button>
        <span id="display-panel"></span>
      </div>
    </section>
    <aside id="style-drawer"></aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
