<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>圣言投屏 · 控制窗</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        font-family: "Noto Serif CJK SC", "Source Han Serif SC", serif;
        background: #F7F4EE;
        color: #26221C;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 18px;
        border-bottom: 1px solid #D8D2C4;
      }
      h1 { font-size: 16px; margin: 0; font-weight: 600; }
      #banner {
        font-size: 13px;
        color: #8A4A1C;
        background: #F3E2C8;
        border: 1px solid #D8B88A;
        border-radius: 6px;
        padding: 4px 10px;
        display: none;
      }
      #banner.visible { display: inline-block; }
      /* R3：左栏选经 / 右栏操作条+预览 */
      #layout { display: grid; grid-template-columns: 340px 1fr; gap: 14px; padding: 14px 18px; align-items: start; }
      #left-panel, #right-panel {
        border: 1px solid #E2DCCF;
        border-radius: 6px;
        padding: 12px 14px;
        background: #FFFFFF;
        max-height: 80vh;
        /* R6：左栏不出现横向滚动，全名不截断可换行 */
        overflow-x: hidden;
        overflow-y: auto;
      }
      #right-panel { display: flex; flex-direction: column; gap: 10px; padding: 0; background: transparent; border: none; max-height: none; overflow: visible; }
      .search-box { position: relative; }
      .search-input {
        width: 100%;
        font-size: 14px;
        font-family: inherit;
        padding: 9px 12px;
        min-height: 40px;
        border: 1px solid #C9C0AD;
        border-radius: 6px;
        background: #FFFDF8;
        color: #26221C;
        box-sizing: border-box;
      }
      .search-input:focus { outline: 2px solid #A8863C; outline-offset: -1px; }
      .search-dropdown {
        position: absolute;
        top: 44px;
        left: 0;
        right: 0;
        z-index: 5;
        list-style: none;
        margin: 0;
        padding: 4px;
        background: #FFFDF8;
        border: 1px solid #C9C0AD;
        border-radius: 6px;
        box-shadow: 0 4px 10px rgba(38, 34, 28, 0.12);
        max-height: 300px;
        overflow-y: auto;
      }
      .search-item {
        display: flex;
        width: 100%;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        padding: 8px 10px;
        min-height: 36px;
        border: none;
        border-radius: 6px;
        background: transparent;
        cursor: pointer;
        font-family: inherit;
        text-align: left;
      }
      .search-item:hover { background: #F3EDDF; }
      /* R6：全名不截断可换行、前缀高亮 */
      .search-item-name { white-space: normal; word-break: break-word; }
      .search-item-meta { font-size: 11px; color: #8C8375; font-family: ui-monospace, monospace; }
      .search-hl { background: #F6DFA6; color: inherit; padding: 0 1px; border-radius: 2px; }
      .history-title { font-size: 13px; margin: 0 0 10px; color: #A8863C; font-weight: 600; }
      .history-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
      .history-item {
        display: flex;
        width: 100%;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        padding: 8px 10px;
        min-height: 36px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: #FFFDF8;
        cursor: pointer;
        font-family: inherit;
        text-align: left;
      }
      .history-item:hover { background: #F3EDDF; }
      .history-item-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .history-item-time { font-size: 11px; color: #8C8375; font-family: ui-monospace, monospace; flex-shrink: 0; }
      .history-empty { font-size: 13px; color: #8C8375; padding: 8px 2px; }
      .tab-bar { display: flex; gap: 8px; margin: 12px 0 10px; }
      .tab-btn {
        font-size: 14px;
        padding: 6px 14px;
        min-height: 36px;
        border: 1px solid #C9C0AD;
        border-radius: 6px;
        background: #FFFDF8;
        cursor: pointer;
      }
      .tab-btn.active { background: #F3EDDF; border-color: #A8863C; color: #A8863C; font-weight: 600; }
      /* R3/R6：每卷一行全名（简称次要），无横滚 */
      .book-list { display: flex; flex-direction: column; gap: 4px; overflow-x: hidden; }
      .book-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        font-size: 15px;
        padding: 9px 12px;
        min-height: 40px;
        border: 1px solid #C9C0AD;
        border-radius: 6px;
        background: #FFFDF8;
        color: #26221C;
        cursor: pointer;
        font-family: inherit;
        text-align: left;
        white-space: normal;
        box-sizing: border-box;
      }
      .book-btn:hover { filter: brightness(0.96); }
      .book-name { white-space: normal; word-break: break-word; }
      .book-short { flex-shrink: 0; font-size: 12px; opacity: 0.55; }
      /* R3：操作条（预览顶上，左→右：投屏 / 选区 / 复制 / A± / 主题色板 / 抽屉） */
      #op-bar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        border: 1px solid #E2DCCF;
        border-radius: 6px;
        padding: 8px 10px;
        background: #FFFFFF;
      }
      .project-btn { min-width: 104px; font-weight: 600; }
      .project-btn.active { background: #A8863C; border-color: #8A6D2F; color: #FFFDF8; }
      button {
        font-family: inherit;
        font-size: 14px;
        padding: 8px 14px;
        min-height: 40px;
        border: 1px solid #C9C0AD;
        border-radius: 6px;
        background: #FFFDF8;
        color: #26221C;
        cursor: pointer;
      }
      button:hover { background: #F3EDDF; }
      .selection-label { min-width: 120px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .selection-label.empty { color: #8C8375; }
      .op-small { padding: 6px 10px; min-height: 34px; font-size: 13px; }
      .op-icon { min-width: 40px; padding: 8px 10px; }
      .font-steps { display: flex; gap: 4px; }
      .font-steps button { min-width: 44px; }
      .theme-palette { display: flex; gap: 4px; }
      .theme-swatch {
        position: relative;
        width: 30px;
        height: 30px;
        min-width: 0;
        min-height: 0;
        padding: 0;
        border: 2px solid #C9C0AD;
        border-radius: 6px;
        cursor: pointer;
      }
      .theme-swatch.active { outline: 2px solid #A8863C; outline-offset: 1px; }
      .theme-swatch-accent { position: absolute; right: 2px; bottom: 2px; width: 8px; height: 8px; border-radius: 50%; }
      /* R3/R4/R5：预览区与投影同源渲染（自然段落流+纵向滚动），文本可选中可复制 */
      #preview-wrap { position: relative; flex: 1; display: flex; min-height: 0; }
      #preview-panel {
        flex: 1;
        min-height: 320px;
        max-height: 74vh;
        overflow-y: auto;
        overflow-x: hidden;
        border: 1px solid #E2DCCF;
        border-radius: 6px;
        background: #101418;
        user-select: text;
      }
      #preview-panel::-webkit-scrollbar { width: 0; height: 0; }
      #preview-panel .preview-empty { font-size: 14px; opacity: 0.7; padding: 24px; }
      #preview-panel .passage { max-width: 100%; }
      #preview-panel .flow { margin: 0; }
      #preview-panel .passage-title { opacity: 0.6; margin-bottom: 1.2em; letter-spacing: 0.2em; }
      #preview-panel sup.vnum { font-size: 0.5em; margin: 0 0.3em 0 0.15em; vertical-align: super; }
      #preview-panel .vtext { white-space: pre-wrap; }
      #preview-panel .vtext.current { border-radius: 6px; padding: 0 0.08em; }
      /* R4：底部细进度条（无箭头无页数；淡显 30%，静止 3s 全隐） */
      #preview-scrollbar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 3px;
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 5;
        pointer-events: none;
      }
      #preview-scrollbar.visible { opacity: 0.3; }
      #preview-scrollbar .scrollbar-thumb {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 30%;
        left: calc(var(--scroll-ratio, 0) * 70%);
        background: #E8C87A;
        border-radius: 2px;
      }
      /* T4-style 样式抽屉（§6.2 右抽屉） */
      .style-drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 320px;
        overflow-y: auto;
        padding: 14px 16px;
        background: #FFFDF8;
        border-left: 1px solid #C9C0AD;
        box-shadow: -4px 0 12px rgba(38, 34, 28, 0.1);
        z-index: 20;
      }
      .style-drawer h3 { font-size: 13px; color: #A8863C; margin: 14px 0 8px; }
      .style-drawer h3:first-child { margin-top: 0; }
      .style-section { border-bottom: 1px dashed #E2DCCF; padding-bottom: 10px; }
      .style-field { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
      .style-label { font-size: 13px; color: #26221C; flex-shrink: 0; }
      .style-field input[type="number"], .style-field select {
        width: 130px;
        font-size: 13px;
        font-family: inherit;
        padding: 6px 8px;
        min-height: 32px;
        border: 1px solid #C9C0AD;
        border-radius: 6px;
        background: #FFFFFF;
      }
      .style-field input[type="color"] { width: 48px; height: 32px; padding: 2px; border: 1px solid #C9C0AD; border-radius: 6px; background: #FFFFFF; }
      .style-theme-row { display: flex; gap: 8px; }
      .style-theme-row button { flex: 1; min-height: 40px; }
      .style-custom-input {
        width: 100%;
        font-size: 13px;
        font-family: inherit;
        padding: 8px 10px;
        min-height: 36px;
        margin-top: 6px;
        border: 1px solid #C9C0AD;
        border-radius: 6px;
        background: #FFFFFF;
        box-sizing: border-box;
      }
      .style-error { font-size: 12px; color: #A83232; margin-top: 6px; }
      /* T7-cascade（R2）：四列级联选经弹窗——浮层覆盖搜索/预览区，不占固定布局 */
      .cascade-overlay {
        position: fixed;
        inset: 0;
        z-index: 30;
      }
      .cascade-mask {
        position: absolute;
        inset: 0;
        background: rgba(38, 34, 28, 0.35);
      }
      .cascade-dialog {
        position: absolute;
        top: 8%;
        left: 50%;
        transform: translateX(-50%);
        width: min(920px, 92vw);
        max-height: 80vh;
        display: flex;
        flex-direction: column;
        background: #FFFDF8;
        border: 1px solid #C9C0AD;
        border-radius: 8px;
        box-shadow: 0 12px 28px rgba(38, 34, 28, 0.25);
        overflow: hidden;
      }
      .cascade-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-bottom: 1px solid #E2DCCF;
      }
      .cascade-title { font-size: 14px; color: #A8863C; font-weight: 600; }
      .cascade-close { min-width: 40px; min-height: 40px; }
      .cascade-cols {
        display: grid;
        grid-template-columns: 1.4fr 1fr 1fr 1fr;
        gap: 8px;
        padding: 12px 14px;
        overflow: hidden;
        flex: 1;
        min-height: 0;
      }
      .cascade-col {
        display: flex;
        flex-direction: column;
        border: 1px solid #E2DCCF;
        border-radius: 6px;
        min-height: 320px;
        max-height: 56vh;
        overflow: hidden;
      }
      .cascade-col-title {
        font-size: 12px;
        color: #A8863C;
        font-weight: 600;
        padding: 6px 10px;
        border-bottom: 1px solid #E2DCCF;
        flex-shrink: 0;
      }
      .cascade-col-list {
        flex: 1;
        overflow-y: auto;
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .cascade-book, .cascade-chapter, .cascade-verse {
        font-family: inherit;
        font-size: 14px;
        text-align: left;
        padding: 6px 10px;
        min-height: 34px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        cursor: pointer;
      }
      .cascade-chapter, .cascade-verse { text-align: center; }
      .cascade-col-list .cascade-book:hover, .cascade-col-list .cascade-chapter:hover, .cascade-col-list .cascade-verse:hover {
        background: #F3EDDF;
      }
      .cascade-book.selected, .cascade-chapter.selected, .cascade-verse.selected {
        background: #F3E2C8;
        border-color: #D8B88A;
        font-weight: 600;
      }
      .cascade-hint { font-size: 13px; color: #8C8375; padding: 8px 4px; }
    </style>
  </head>
  <body>
    <header>
      <h1>圣言投屏 · 控制窗</h1>
      <span id="banner"></span>
    </header>
    <div id="layout">
      <div id="left-panel">
        <div id="search-panel"></div>
        <div id="books-panel"></div>
        <div id="history-panel"></div>
      </div>
      <div id="right-panel">
        <div id="op-bar">
          <button id="btn-project" class="project-btn" title="投屏 / 取消投屏（P）">投屏</button>
          <button id="btn-selection" class="selection-label" title="点击改选经文范围">未选经文</button>
          <button id="btn-copy" class="op-small" title="复制当前经文">复制经文</button>
          <div class="font-steps">
            <button id="btn-font-down" title="缩小字号（−）">A−</button>
            <button id="btn-font-up" title="放大字号（＋）">A+</button>
          </div>
          <div id="theme-palette"></div>
          <button id="btn-style" class="op-icon" title="样式抽屉（S）">⚙</button>
        </div>
        <div id="preview-wrap">
          <div id="preview-panel"></div>
          <div id="preview-scrollbar"><div class="scrollbar-thumb"></div></div>
        </div>
      </div>
    </div>
    <aside id="style-drawer"></aside>
    <div id="cascade-root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
